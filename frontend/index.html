<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Аспект — бизнес-радар</title>
    <script>
      (function () {
        try {
          var key = 'aspekt.theme'
          var pref = localStorage.getItem(key)
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system'
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.setAttribute('data-theme-preference', pref)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.setAttribute('data-theme-preference', 'system')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Interim geometric fallback until licensed Styrene A/B LC files are in /fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
