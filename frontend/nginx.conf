# Competition web: same-origin /api proxy + SPA fallback.
# proxy timeouts must exceed ASSISTANT_LOOP_TIMEOUT_S (default 90) so the API
# can return a normal success/error before the proxy cuts the connection.

upstream competition_api {
    server api:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness for compose healthcheck (no upstream / model HTTP).
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        # Agent loop server timeout is 90s; leave headroom for response framing.
        proxy_read_timeout 120s;

        # Large enough for PDF downloads with Bearer.
        client_max_body_size 32m;
        proxy_buffering off;

        proxy_pass http://competition_api;
    }

    # System health via API (optional; browser uses /healthz above).
    location = /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_pass http://competition_api/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
